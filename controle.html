<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102e2c">
  <meta name="description" content="Écran de démonstration du terminal de contrôle des titres à Bouilly.">
  <title>Contrôle des titres · Bouilly</title>
  <style>
    :root {
      color-scheme: dark;
      color: #f1f5ef;
      background: #102e2c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --accent: #bdeebe;
      --muted: #bdcec6;
      --line: #52716a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .terminal {
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(100%, 30rem);
      min-height: 100vh;
      min-height: 100svh;
      margin: auto;
      padding: clamp(1.25rem, 6vw, 2rem);
    }
    header, footer {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: .6rem;
      color: var(--muted);
      font: 650 .72rem/1.4 ui-monospace, Consolas, monospace;
      letter-spacing: .065em;
      text-transform: uppercase;
    }
    header { border-bottom: 1px solid var(--line); padding-bottom: 1rem; }
    header strong { color: var(--accent); }
    footer { border-top: 1px solid var(--line); padding-top: 1rem; }
    main { align-self: center; text-align: center; padding: 1.5rem 0; }
    .reader { display: block; width: clamp(5rem, 28vw, 9rem); height: auto; margin: 0 auto 1.3rem; color: var(--accent); }
    .status {
      display: inline-block;
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 2rem;
      padding: .35rem .75rem;
      color: var(--accent);
      font: 650 .72rem/1.4 ui-monospace, Consolas, monospace;
      letter-spacing: .065em;
      text-transform: uppercase;
    }
    h1 { margin: .65rem 0 .5rem; font-size: clamp(2rem, 8vw, 3.4rem); line-height: 1.05; letter-spacing: -.045em; }
    .instruction { margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="terminal">
    <header><strong>Contrôle des titres</strong><span>Bouilly</span></header>
    <main>
      <svg class="reader" viewBox="0 0 128 128" fill="none" aria-hidden="true">
        <rect x="9" y="9" width="110" height="110" rx="24" fill="#183c37" stroke="#52716a"/>
        <path d="M23 42v-8a11 11 0 0 1 11-11h8m44 0h8a11 11 0 0 1 11 11v8m0 44v8a11 11 0 0 1-11 11h-8m-44 0h-8a11 11 0 0 1-11-11v-8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M53 51a16 16 0 0 1 22 0m-26-6a22 22 0 0 1 30 0m-22 12a10 10 0 0 1 14 0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="43" y="66" width="42" height="25" rx="5" stroke="currentColor" stroke-width="2.5"/>
        <path d="M44 74h40" stroke="currentColor" stroke-width="2.5"/>
      </svg>
      <p class="status">En attente</p>
      <h1>Présentez<br>votre titre</h1>
      <p class="instruction">Approchez votre titre de transport du lecteur.</p>
    </main>
    <footer><span>Terminal 01</span><span>Accessoire · Démo</span></footer>
  </div>
</body>
</html>
